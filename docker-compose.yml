services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CircuitBay: Server=sql,1433;Database=CircuitBay;User Id=sa;Password=Strong_dev_password_2026!;TrustServerCertificate=True;MultipleActiveResultSets=True
      Jwt__SigningKey: local-compose-signing-key-for-circuitbay-2026
      ConnectionStrings__Redis: redis:6379
      Infrastructure__Startup__DatabaseMaxAttempts: 45
      Infrastructure__Startup__DatabaseDelaySeconds: 3
    depends_on:
      sql:
        condition: service_healthy
      redis:
        condition: service_healthy

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Strong_dev_password_2026!
    healthcheck:
      test: ["CMD-SHELL", "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Strong_dev_password_2026!\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"Strong_dev_password_2026!\" -Q \"SELECT 1\") || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - circuitbay-sql:/var/opt/mssql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  circuitbay-sql:
