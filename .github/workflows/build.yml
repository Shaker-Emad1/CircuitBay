name: Build

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.dockerignore'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: 'CircuitBay.slnx'

      - name: Restore Dependencies
        run: dotnet restore CircuitBay.slnx --verbosity normal

      # Suppress non-blocking NuGet audit warnings (NU1901-NU1904) to prevent transient upstream alerts from halting CI.
      - name: Build Solution (Release)
        run: |
          dotnet build CircuitBay.slnx \
            --no-restore \
            --configuration Release \
            /p:TreatWarningsAsErrors=true \
            /p:WarningsNotAsErrors="NU1901;NU1902;NU1903;NU1904"
