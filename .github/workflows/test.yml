name: Test

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.dockerignore'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: 'CircuitBay.slnx'

      - name: Restore Dependencies
        run: dotnet restore CircuitBay.slnx --verbosity normal

      - name: Execute Tests (Release)
        run: |
          dotnet test CircuitBay.slnx \
            --no-restore \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --verbosity normal

      # Uploading TRX files allows the team to download and parse failures in VS or Rider easily.
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
          retention-days: 14
